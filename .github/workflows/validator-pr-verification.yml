name: Validator PR regression verification

on:
  push:
    branches: [ci/validator-pr-verification]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']
        revision:
          - fa07363
          - e7c3d75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validator dependency
        run: python -m pip install -r .github/workflows/validator/requirements.txt
      - name: Run regression tests on the PR commit
        env:
          PYTHONPATH: .github/workflows/validator
        run: |
          git rev-parse HEAD
          python -m unittest discover -s .github/workflows/validator/tests -v
          git diff --check
